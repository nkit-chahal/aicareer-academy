{% extends "base.html" %}
{% block content %}
<section class="page-hero band">
  <h1 class="h-scribble">Book a career call</h1>
  <svg class="scratch" viewBox="0 0 96 14" aria-hidden="true"><path d="M4 9 Q24 2 48 8 T92 7"/></svg>
  <p class="center-copy">Enquire opens WhatsApp to {{ contact_name }} with your details — 15 minutes, no sales pitch.</p>
</section>

<section class="enquire-bar register-section">
  <form id="inquiryForm" class="enquire-row" novalidate>
    <div class="field">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" autocomplete="name" required />
      <p class="form-error" id="nameError" role="alert"></p>
    </div>
    <div class="field">
      <label for="phone">Mobile *</label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" required />
      <p class="form-error" id="phoneError" role="alert"></p>
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
      <p class="form-error" id="emailError" role="alert"></p>
    </div>
    <div class="field">
      <label for="experience">Experience *</label>
      <select id="experience" name="experience" required>
        <option value="">Select</option>
        <option value="Fresher (0–1 years)">Fresher (0–1 years)</option>
        <option value="1–3 years">1–3 years</option>
        <option value="3–5 years">3–5 years</option>
        <option value="5–8 years">5–8 years</option>
        <option value="8+ years">8+ years</option>
      </select>
      <p class="form-error" id="experienceError" role="alert"></p>
    </div>
    <div class="field">
      <label for="course">Program *</label>
      <select id="course" name="course" required>
        <option value="">Select</option>
        {% for p in programs %}
        <option value="{{ p.slug }}">{{ p.title }}</option>
        {% endfor %}
        <option value="not-sure">Not sure yet</option>
      </select>
      <p class="form-error" id="courseError" role="alert"></p>
    </div>
    <div class="field">
      <label for="cityField">City</label>
      <input id="cityField" name="city" autocomplete="address-level2" />
    </div>
    <div class="field" style="flex-basis:100%;">
      <label for="message">Message (optional)</label>
      <input id="message" name="message" />
    </div>
    <button type="submit" class="btn-black">Enquire</button>
  </form>
</section>
{% endblock %}
